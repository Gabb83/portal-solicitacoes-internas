services:

  postgres:
    image: postgres:17
    container_name: portal-solicitacoes-db
    environment:
      POSTGRES_DB: portal_solicitacoes
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portal_solicitacoes"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend/portal-solicitacoes
    container_name: portal-solicitacoes-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portal_solicitacoes
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: portal-solicitacoes-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8080/api
    depends_on:
      - backend

volumes:
  postgres_data: